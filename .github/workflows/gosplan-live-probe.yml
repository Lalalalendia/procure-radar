name: GosPlan Live Probe

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOSPLAN_BASE_URL: ${{ secrets.GOSPLAN_BASE_URL || 'https://v2test.gosplan.info' }}
      GOSPLAN_API_KEY: ${{ secrets.GOSPLAN_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install probe dependency
        run: python -m pip install httpx==0.28.1

      - name: Query Bashkortostan purchases
        run: python scripts/gosplan_probe.py

      - name: Publish probe summary
        shell: bash
        run: |
          echo "## GosPlan live probe" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`json' >> "$GITHUB_STEP_SUMMARY"
          cat data/probe-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw probe
        uses: actions/upload-artifact@v4
        with:
          name: gosplan-live-probe
          path: data/
          retention-days: 7
