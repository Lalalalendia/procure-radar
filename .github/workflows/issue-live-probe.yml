name: GosPlan Issue Trigger Probe

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: startsWith(github.event.issue.title, '[probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install probe dependency
        run: python -m pip install httpx==0.28.1

      - name: Query Bashkortostan purchases
        env:
          GOSPLAN_BASE_URL: https://v2test.gosplan.info
        run: python scripts/gosplan_probe.py

      - name: Upload raw probe
        uses: actions/upload-artifact@v4
        with:
          name: gosplan-live-probe
          path: data/
          retention-days: 7
